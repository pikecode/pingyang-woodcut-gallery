<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- White background with rounded corners (Apple style) -->
  <rect width="512" height="512" fill="white" rx="110"/>

  <!-- Main seal + book icon centered -->
  <g transform="translate(256, 256)">
    <!-- Outer circular seal ring - vibrant red -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#E63946" stroke-width="14"/>

    <!-- Inner square frame (traditional seal) -->
    <rect x="-95" y="-95" width="190" height="190" fill="none" stroke="#E63946" stroke-width="9"/>

    <!-- Central book/pages icon - clean and minimal -->
    <g transform="translate(-40, -35)">
      <!-- Page 1 (back, dark gold) -->
      <rect x="0" y="0" width="60" height="75" fill="#D4A574" stroke="#9D7E47" stroke-width="1.5" rx="2"/>

      <!-- Page 2 (middle, bright gold) -->
      <rect x="7" y="5" width="60" height="75" fill="#FFD700" stroke="#B8860B" stroke-width="1.5" rx="2"/>

      <!-- Page 3 (front, white with red) -->
      <rect x="14" y="10" width="60" height="75" fill="#FFFFFF" stroke="#E63946" stroke-width="2" rx="2"/>

      <!-- Text lines for detail - subtle red -->
      <line x1="20" y1="28" x2="68" y2="28" stroke="#E63946" stroke-width="1" opacity="0.4"/>
      <line x1="20" y1="38" x2="68" y2="38" stroke="#E63946" stroke-width="1" opacity="0.4"/>
      <line x1="20" y1="48" x2="68" y2="48" stroke="#E63946" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Accent dot at bottom - golden -->
    <circle cx="0" cy="85" r="8" fill="#FFD700" stroke="#E63946" stroke-width="1.5"/>
  </g>
</svg>
