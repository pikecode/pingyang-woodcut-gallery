name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'data/**'
      - 'scripts/build_web_assets.py'
  workflow_dispatch:
    inputs:
      release:
        description: '创建 Release（true/false）'
        required: false
        default: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS
            artifact_path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            name: Windows
            artifact_path: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''   # 留空 = 不签名（开发构建）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS：上传 .dmg ──────────────────────────────────
      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pingyang-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

      # ── Windows：上传 .msi 和 .exe ───────────────────────
      - name: Upload Windows MSI
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pingyang-windows-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      - name: Upload Windows NSIS installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pingyang-windows-exe
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # ── 可选：当 workflow_dispatch 且 release=true 时创建 Release ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.release == 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: 平阳木版年画桌面端 build-${{ github.run_number }}
          body: |
            ## 平阳木版年画数字画廊 · 桌面端

            ### 下载
            - **macOS**：下载 `.dmg`，双击安装
            - **Windows**：下载 `.msi`（推荐）或 `.exe` 安装程序

            > 构建编号：${{ github.run_number }}
            > 提交：${{ github.sha }}
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
